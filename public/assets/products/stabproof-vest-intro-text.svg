<svg width="298" height="446" viewBox="0 0 298 446" fill="none" xmlns="http://www.w3.org/2000/svg">
<text fill="white" xml:space="preserve" style="white-space: pre" font-family="Pretendard" font-size="15" font-weight="500" letter-spacing="-0.03em"><tspan x="0.0703125" y="16.832">Comfortable Jumper-Type Design</tspan></text>
<text fill="white" fill-opacity="0.5" xml:space="preserve" style="white-space: pre" font-family="Pretendard" font-size="12" font-weight="500" letter-spacing="-0.03em"><tspan x="18.0703" y="46.2656">Easy to put on and take off&#10;</tspan><tspan x="18.0703" y="64.2656">Protective design around zipper and both sides&#10;</tspan><tspan x="18.0703" y="82.2656">MOLLE system allows pouch attachment&#10;</tspan><tspan x="18.0703" y="100.266">Specialized design for police work, enhancing </tspan><tspan x="18.0703" y="118.266">mobility &#x2028;</tspan><tspan x="18.0703" y="136.266">and practicality</tspan></text>
<text fill="white" xml:space="preserve" style="white-space: pre" font-family="Pretendard" font-size="15" font-weight="500" letter-spacing="-0.03em"><tspan x="0.0703125" y="197.832">Provides protective performance &#x2028;</tspan><tspan x="0.0703125" y="220.832">against sharp weapons</tspan></text>
<text fill="white" fill-opacity="0.5" xml:space="preserve" style="white-space: pre" font-family="Pretendard" font-size="12" font-weight="500" letter-spacing="-0.03em"><tspan x="0.0703125" y="250.266">Certified for NIJ STD 0115.00 LEVEL 1 (E1, E2) &#x2028;</tspan><tspan x="0.0703125" y="268.266">&#x2014; provides PI, S1, and SPIKE protection</tspan></text>
<text fill="white" xml:space="preserve" style="white-space: pre" font-family="Pretendard" font-size="15" font-weight="500" letter-spacing="-0.03em"><tspan x="0.0703125" y="329.832">Applies JKG-developed proprietary </tspan><tspan x="0.0703125" y="352.832">fabric and has undergone multiple </tspan><tspan x="0.0703125" y="375.832">performance tests</tspan></text>
<text fill="white" fill-opacity="0.5" xml:space="preserve" style="white-space: pre" font-family="Pretendard" font-size="12" font-weight="500" letter-spacing="-0.03em"><tspan x="0.0703125" y="405.266">Over 15 performance tests completed by </tspan><tspan x="0.0703125" y="423.266">accredited domestic and international </tspan><tspan x="0.0703125" y="441.266">certification institutes</tspan></text>
</svg>
